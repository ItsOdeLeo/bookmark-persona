<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="robots" content="noindex">
<title>Bookmark Persona Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700;900&display=block" rel="stylesheet">
<style>
  :root { --ink: #16161A; --paper: #F6F5F2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); }
  body {
    font-family: 'Inter Tight', 'Noto Sans SC', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .card { width: 1080px; height: 1350px; padding: 52px 56px 40px; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 20px; height: 84px; }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%; flex: none; object-fit: cover; background: #ddd;
    box-shadow: 0 0 0 4px #fff, 0 6px 18px rgba(0,0,0,.12);
    display: grid; place-items: center; font-size: 34px; font-weight: 800;
  }
  .who { min-width: 0; }
  .name { font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; max-width: 560px; }
  .handle { font-size: 25px; font-weight: 500; opacity: .5; margin-top: 2px; }
  .brand { margin-left: auto; text-align: right; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; line-height: 1.4; }
  .brand span { display: block; font-weight: 600; letter-spacing: .06em; opacity: .45; }

  h1 { margin-top: 26px; font-size: 66px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
  h1 i { font-style: normal; opacity: .28; }

  .duel { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
  .side {
    height: 686px; border-radius: 44px; background: var(--panel);
    padding: 26px 26px 28px; display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .label { font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; background: var(--ink); color: #fff; border-radius: 999px; padding: 9px 18px 8px; }
  .sub { font-size: 22px; font-weight: 600; margin-top: 10px; opacity: .55; }
  .creature { width: 318px; height: 318px; margin-top: 2px; }
  .creature svg { width: 100%; height: 100%; display: block; }
  .type { font-size: 132px; font-weight: 800; letter-spacing: -.04em; line-height: .86; margin-top: -6px; }
  .type .flip { color: var(--accent); }
  /* Swing letters (under 55%) teeter, as if about to flip. */
  .type .swing { display: inline-block; margin: 0 .05em; transform: rotate(var(--tilt)); transform-origin: 50% 80%; }
  .scores { display: flex; gap: 8px; margin-top: 16px; }
  .scores span { display: inline-flex; align-items: center; gap: 5px; font-size: 18px; font-weight: 700; background: rgba(255,255,255,.65); border-radius: 999px; padding: 5px 11px 4px; }
  .scores span.flip { color: var(--accent); }
  .scores span.swing { background: transparent; border: 2px dashed currentColor; padding: 3px 10px 2px 8px; }
  .scores svg, .swingnote svg { width: 16px; height: 16px; flex: none; display: block; }
  .nick { font-size: 36px; font-weight: 800; letter-spacing: -.01em; line-height: 1.08; margin-top: 18px; max-height: 78px; overflow: hidden; }
  /* Detailed version ("detail": true): two theme lines per side, so the pets shrink to make room. */
  .card.detail .side { height: 736px; }
  .card.detail .creature { width: 268px; height: 268px; margin-top: 0; }
  .card.detail .nick { font-size: 34px; margin-top: 16px; max-height: 74px; }
  .lines {
    list-style: none; margin-top: 18px; width: 100%; max-height: 196px; overflow: hidden;
    font-size: 24px; font-weight: 500; line-height: 1.28; text-align: left; display: flex; flex-direction: column; gap: 12px;
  }
  .lines li { position: relative; padding-left: 30px; text-wrap: pretty; }
  .lines li::before { content: '→'; position: absolute; left: 0; font-weight: 800; opacity: .45; }

  .vs {
    position: absolute; left: 50%; top: 232px; transform: translate(-50%, -50%);
    width: 84px; height: 84px; border-radius: 50%; background: var(--ink); color: #fff;
    border: 6px solid var(--paper); display: grid; place-items: center;
    font-size: 28px; font-weight: 800;
  }

  .bottom { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px 10px 12px; }
  .pills { display: flex; align-items: center; gap: 10px; }
  .flips { font-size: 19px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; background: #fff; border-radius: 999px; padding: 8px 18px 7px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .swingnote { display: inline-flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; border: 2px dashed rgba(22,22,26,.35); border-radius: 999px; padding: 6px 16px 5px 13px; }
  .verdict { font-size: 40px; font-weight: 800; line-height: 1.14; text-align: center; letter-spacing: -.02em; max-height: 92px; overflow: hidden; max-width: 940px; text-wrap: balance; }

  footer { border-top: 2px solid rgba(22,22,26,.1); padding-top: 16px; display: flex; align-items: center; gap: 28px; }
  .foot-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .by { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; }
  .by > span:first-child { opacity: .55; }
  .maker { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: #fff; border-radius: 999px; padding: 7px 15px 7px 12px; font-weight: 700; }
  .maker svg { width: 16px; height: 16px; fill: #fff; display: block; }
  /* QR code so a shared screenshot still leads back to the template. */
  .qr { display: flex; align-items: center; gap: 16px; flex: none; }
  .qr .cta { text-align: right; font-size: 24px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; }
  .qr .cta span { display: block; font-size: 16px; font-weight: 600; opacity: .5; letter-spacing: 0; margin-top: 4px; }
  .qr .code { width: 148px; height: 148px; padding: 9px; background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .qr .code svg { width: 100%; height: 100%; display: block; }
  .stats { font-weight: 600; opacity: .55; font-size: 19px; white-space: nowrap; }
  .disclaimer { font-size: 15px; font-weight: 500; opacity: .42; line-height: 1.3; }

  html[lang="zh"] h1 { font-size: 62px; letter-spacing: 0; }
  html[lang="zh"] .label { letter-spacing: .2em; }
  html[lang="zh"] .nick { font-size: 38px; }
  html[lang="zh"] .card.detail .nick { font-size: 36px; }
  html[lang="zh"] .lines { font-size: 25px; }

  .error { padding: 80px; font-size: 32px; font-weight: 700; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="persona.js"></script>
<script>
(function () {
  const STR = {
    en: {
      title: 'My posts <i>vs.</i> my bookmarks',
      brand: ['Bookmark Persona', 'read by Grok'],
      front: ['Front stage', 'what I post'],
      back: ['Backstage', 'what I bookmark & like'],
      flips: n => n === 0 ? 'Same type on both sides' : n === 1 ? '1 letter flipped' : `${n} letters flipped`,
      swing: n => n === 1 ? '1 letter on the fence: run it again and it might flip' : `${n} letters on the fence: run it again and they might flip`,
      by: 'Grok Bot template by',
      scan: ['Scan to get yours', 'Grok Bot template'],
      stats: (p, b, l) => `Read ${p} post${p == 1 ? '' : 's'} · ${b} bookmark${b == 1 ? '' : 's'} · ${l} like${l == 1 ? '' : 's'}`,
      disclaimer: 'Just for fun. Not a personality test or psychological advice.',
    },
    zh: {
      title: '我发的 <i>vs</i> 我偷偷存的',
      brand: ['Bookmark Persona', 'Grok 读取'],
      front: ['台前', '我发的帖子'],
      back: ['幕后', '我收藏和点赞的'],
      flips: n => n === 0 ? '台前幕后，表里如一' : `翻转了 ${n} 个字母`,
      swing: n => `${n} 个字母在摇摆，再测一次可能会翻`,
      by: 'Grok Bot 模板作者',
      scan: ['扫码测你的', 'Grok Bot 模板'],
      stats: (p, b, l) => `读取了 ${p} 条帖子 · ${b} 个书签 · ${l} 个点赞`,
      disclaimer: '仅供娱乐，不是心理测评或建议。',
    },
  };

  const DEMO = {
    en: {
      lang: 'en', handle: 'ItsOdeLeo', name: 'Ode Leo',
      front: { type: 'ENFP', scores: [64, 81, 58, 70] },
      back: { type: 'INTJ', scores: [77, 72, 69, 61] },
      verdict: 'Posts like a hype machine, saves like a war-room strategist.',
      stats: { posts: 120, bookmarks: 214, likes: 300 },
    },
    zh: {
      lang: 'zh', handle: 'ItsOdeLeo', name: 'Ode Leo',
      front: { type: 'ENFP', scores: [64, 81, 58, 70] },
      back: { type: 'INTJ', scores: [77, 72, 69, 61] },
      verdict: '发帖像气氛组，收藏像作战室参谋。',
      stats: { posts: 120, bookmarks: 214, likes: 300 },
    },
  };

  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
  }

  function readData() {
    const h = location.hash.slice(1);
    if (!h || h.startsWith('demo')) return DEMO[h === 'demo=zh' ? 'zh' : 'en'];
    if (h.startsWith('d=')) return JSON.parse(b64urlDecode(h.slice(2)));
    return JSON.parse(decodeURIComponent(h));
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // Shrink a box's font until its content fits.
  function fit(node, min) {
    let size = parseFloat(getComputedStyle(node).fontSize);
    while ((node.scrollHeight > node.clientHeight + 1 || node.scrollWidth > node.clientWidth + 1) && size > min) {
      size -= 1;
      node.style.fontSize = size + 'px';
    }
  }

  // Where the QR code on the card leads: the public Grok Bot template.
  const GET_LINK = 'https://x.ai/bot/n-19X3xySPROJG9JTLWAl';

  // A letter under this share is "on the fence" and may flip on another run.
  const SWING = 55;
  const SWAP_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h13M14 4l4 4-4 4M19 16H6M10 12l-4 4 4 4"/></svg>';

  function percents(info) {
    const sc = info.scores;
    if (!Array.isArray(sc) || sc.length !== 4 || !sc.every(n => Number.isFinite(+n))) return null;
    return sc.map(n => Math.max(50, Math.min(100, Math.round(+n))));
  }

  function side(info, other, s, lang, detail) {
    const pal = Persona.palette(info.type);
    const box = el('section', 'side');
    box.style.setProperty('--panel', pal.panel);
    box.style.setProperty('--accent', pal.accent);
    box.append(el('div', 'label', s[0]), el('div', 'sub', s[1]));
    const art = el('div', 'creature');
    art.innerHTML = Persona.creatureSVG(info.type);
    box.append(art);
    const pct = percents(info);
    const cls = (ch, i) => [ch !== other[i] ? 'flip' : '', pct && pct[i] < SWING ? 'swing' : ''].join(' ').trim();
    const type = el('div', 'type');
    let tilts = 0;
    [...info.type].forEach((ch, i) => {
      const span = el('span', cls(ch, i), ch);
      if (span.classList.contains('swing')) span.style.setProperty('--tilt', (tilts++ % 2 ? 8 : -8) + 'deg');
      type.append(span);
    });
    box.append(type);
    if (pct) {
      const row = el('div', 'scores');
      [...info.type].forEach((ch, i) => {
        const pill = el('span', cls(ch, i));
        if (pill.classList.contains('swing')) pill.innerHTML = SWAP_ICON;
        pill.append(document.createTextNode(`${ch} ${pct[i]}%`));
        row.append(pill);
      });
      box.append(row);
    }
    box.append(el('div', 'nick', Persona.TYPES[info.type][lang]));
    if (detail) {
      const ul = el('ul', 'lines');
      (info.lines || []).slice(0, 2).forEach(line => ul.append(el('li', '', String(line))));
      box.append(ul);
    }
    return box;
  }

  function render(d) {
    const lang = d.lang === 'zh' ? 'zh' : 'en';
    const s = STR[lang];
    document.documentElement.lang = lang;
    const front = d.front || {}, back = d.back || {};
    front.type = String(front.type || '').toUpperCase();
    back.type = String(back.type || '').toUpperCase();
    if (!Persona.isType(front.type) || !Persona.isType(back.type)) throw new Error('invalid type');

    const card = document.getElementById('card');
    card.textContent = '';
    // The private card (default) shows types and pets only; the theme lines need "detail": true.
    const detail = d.detail === true;
    card.classList.toggle('detail', detail);

    const header = el('header');
    const handle = String(d.handle || '').replace(/^@/, '');
    const name = String(d.name || handle);
    const initial = el('div', 'avatar', (name || '?').trim().charAt(0).toUpperCase());
    initial.style.background = Persona.palette(back.type).panel;
    let avatar = null;
    if (typeof d.avatar === 'string' && /^https:\/\//.test(d.avatar)) {
      avatar = el('img', 'avatar');
      avatar.alt = '';
      avatar.referrerPolicy = 'no-referrer';
      avatar.onerror = () => avatar.replaceWith(initial);
      avatar.src = d.avatar.replace(/_normal(\.\w+)$/, '_400x400$1');
    }
    const who = el('div', 'who');
    who.append(el('div', 'name', name), el('div', 'handle', handle ? '@' + handle : ''));
    const brand = el('div', 'brand', s.brand[0]);
    brand.append(el('span', '', s.brand[1]));
    header.append(avatar || initial, who, brand);

    const h1 = el('h1');
    h1.innerHTML = s.title;

    const duel = el('div', 'duel');
    duel.append(side(front, back.type, s.front, lang, detail), side(back, front.type, s.back, lang, detail), el('div', 'vs', 'VS'));

    const flips = [...front.type].filter((ch, i) => ch !== back.type[i]).length;
    const swings = [front, back].map(percents).flat().filter(p => p != null && p < SWING).length;
    const bottom = el('div', 'bottom');
    const pills = el('div', 'pills');
    pills.append(el('div', 'flips', s.flips(flips)));
    if (swings) {
      const note = el('div', 'swingnote');
      note.innerHTML = SWAP_ICON;
      note.append(document.createTextNode(s.swing(swings)));
      pills.append(note);
    }
    bottom.append(pills);
    if (d.verdict) bottom.append(el('div', 'verdict', String(d.verdict)));

    const footer = el('footer');
    const main = el('div', 'foot-main');
    const by = el('div', 'by');
    const maker = el('span', 'maker');
    maker.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>';
    maker.append(document.createTextNode('@ItsOdeLeo'));
    by.append(el('span', '', s.by), maker);
    // Bottom left, top to bottom: what Grok read, the template credit, the disclaimer.
    const st = d.stats || {};
    if (st.posts != null) main.append(el('div', 'stats', s.stats(st.posts, st.bookmarks ?? 0, st.likes ?? 0)));
    main.append(by, el('div', 'disclaimer', s.disclaimer));
    footer.append(main);
    if (typeof qrcode === 'function') {
      const qr = qrcode(0, 'M');
      qr.addData(GET_LINK);
      qr.make();
      const box = el('div', 'qr');
      const cta = el('div', 'cta', s.scan[0]);
      cta.append(el('span', '', s.scan[1]));
      const code = el('div', 'code');
      code.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      box.append(cta, code);
      footer.append(box);
    }

    card.append(header, h1, duel, bottom, footer);
    return avatar;
  }

  function loaded(img) {
    if (!img || img.complete) return Promise.resolve();
    return new Promise(res => { img.addEventListener('load', res); img.addEventListener('error', res); });
  }

  async function main() {
    let avatar;
    try {
      avatar = render(readData());
    } catch (e) {
      document.getElementById('card').replaceChildren(el('div', 'error', 'Card data is invalid: ' + e.message));
      document.documentElement.dataset.ready = 'error';
      return;
    }
    await Promise.race([
      Promise.all([document.fonts.ready, loaded(avatar)]),
      new Promise(res => setTimeout(res, 8000)),
    ]);
    document.querySelectorAll('.name').forEach(n => fit(n, 24));
    document.querySelectorAll('.nick').forEach(n => fit(n, 24));
    document.querySelectorAll('.lines').forEach(n => fit(n, 18));
    document.querySelectorAll('.verdict').forEach(n => fit(n, 26));
    document.documentElement.dataset.ready = '1';
  }

  main();
  window.addEventListener('hashchange', () => location.reload());
})();
</script>
</body>
</html>
